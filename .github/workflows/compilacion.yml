name: Compilación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Compilar sin ejecutar las pruebas (necesitan MySQL)
        working-directory: reto5
        run: mvn -B -DskipTests compile
